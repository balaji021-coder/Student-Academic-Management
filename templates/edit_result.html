{% extends 'base.html' %}
{% block content %}
<div class="page-header"><h1>✏️ Edit Result</h1></div>
<div class="card">
    <div class="card-header"><h2>Update Exam Result</h2></div>
    <form method="POST" class="form">
        <div class="form-row">
            <div class="form-group">
                <label>Student <span class="required">*</span></label>
                <select name="student_id" required>
                    {% for s in students %}
                    <option value="{{ s.id }}" {{ 'selected' if result.student_id == s.id }}>{{ s.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Subject <span class="required">*</span></label>
                <select name="subject_id" required>
                    {% for s in subjects %}
                    <option value="{{ s.id }}" {{ 'selected' if result.subject_id == s.id }}>{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Exam Name <span class="required">*</span></label>
                <input type="text" name="exam_name" value="{{ result.exam_name }}" required>
            </div>
            <div class="form-group">
                <label>Date <span class="required">*</span></label>
                <input type="date" name="date" value="{{ result.date }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Marks Obtained <span class="required">*</span></label>
                <input type="number" name="marks_obtained" value="{{ result.marks_obtained }}" step="0.5" required>
            </div>
            <div class="form-group">
                <label>Total Marks <span class="required">*</span></label>
                <input type="number" name="total_marks" value="{{ result.total_marks }}" step="0.5" required>
            </div>
        </div>
        <div style="display:flex;gap:1rem;">
            <button type="submit" class="btn btn-primary">💾 Save Changes</button>
            <a href="{{ url_for('results') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
